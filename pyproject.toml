[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-graph"
version = "0.1.0"
description = "Minimal AI Engineering Agent MVP with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph-cli>=0.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "aiosqlite>=0.19",
    "aiogram>=3.0.0",
    "aiohttp>=3.9.0",
    "openhands-sdk==1.21.1",
    "openhands-tools==1.21.1",
    "openhands-workspace==1.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_graph", "src/telegram_bot"]

[project.scripts]
agent-graph = "agent_graph.main:cli"
agent-graph-telegram = "agent_graph.main:telegram_cli"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict = true
