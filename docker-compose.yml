services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=agent_graph
      - POSTGRES_USER=agent_graph
      - POSTGRES_PASSWORD=agent_graph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_graph -d agent_graph"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  openhands:
    image: docker.openhands.dev/openhands/openhands:1.7.0
    ports:
      - "3006:3000"
    environment:
      - LLM_MODEL=openai/Qwen3.6-35B-A3B-UD-MLX-4bit
      - LLM_API_KEY=zaqw
      - LLM_BASE_URL=http://host.docker.internal:8555/v1
      # Keep exception tracebacks as compact \n-separated strings (not pretty-printed)
      - LOGGING_FORMATTER=compact
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.openhands:/.openhands
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  workspace:
  postgres_data:
